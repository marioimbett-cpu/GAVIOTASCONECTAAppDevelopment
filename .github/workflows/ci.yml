# Verificación automática en cada cambio: dependencias seguras, pruebas y compilación.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias (sin scripts de instalación)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high
      - name: Revisión de tipos
        run: pnpm exec tsc --noEmit -p .
      - name: Pruebas
        run: pnpm test
      - name: Compilación
        run: pnpm build
